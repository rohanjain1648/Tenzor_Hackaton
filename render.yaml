services:
  - type: web
    name: verilend-hackathon
    env: node
    plan: free
    buildCommand: "cd server && npm install && cd ../client && npm install && npm run build && cd .."
    startCommand: "cd server && node src/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # You must add GEMINI_API_KEY manually via the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
